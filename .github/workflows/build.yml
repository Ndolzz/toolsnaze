name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Semua secret provider (Phase 4/9) diisi lewat GitHub Secrets,
          # tidak pernah lewat file di repository.
          SOCIAL_API_KEY: ${{ secrets.SOCIAL_API_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: naze-tools-build
          path: .next
          retention-days: 7
